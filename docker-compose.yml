services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_event_finder
    ports:
      - "5432:5432"
    volumes:
      - campus_event_pg:/var/lib/postgresql/data

volumes:
  campus_event_pg:
